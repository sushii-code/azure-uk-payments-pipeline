# Scans the code and its whole git history for secrets, such as keys and passwords
name: Secret scan

# Run on every push to main, and on every pull request into main
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Give the built-in GitHub token only what it needs: read the code and comment on pull requests
permissions:
  contents: read
  pull-requests: write

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      # Download the repo; fetch-depth 0 gets every commit, so old secrets are found too
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Run gitleaks; the run fails if it finds anything that looks like a secret
      # A personal repo only needs the built-in GITHUB_TOKEN, with no gitleaks licence key
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
